# Generic Kamal deployment template for Labfire.
# Copy this file to config/deploy.local.yml or adjust placeholders for your host.

service: labfire
image: ghcr.io/YOUR_ORG/labfire

servers:
  web:
    hosts:
      - YOUR_HOST

ssh:
  user: <%= ENV.fetch("KAMAL_SSH_USER", "deploy") %>

proxy:
  host: YOUR_DOMAIN
  app_port: 80
  ssl: true
  forward_headers: true
  response_timeout: 300
  healthcheck:
    path: /up
    interval: 3
    timeout: 3

registry:
  server: ghcr.io
  username: <%= ENV.fetch("KAMAL_REGISTRY_USERNAME") %>
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64
  context: .
  dockerfile: Dockerfile
  args:
    OCI_SOURCE: https://github.com/YOUR_ORG/labfire
    OCI_DESCRIPTION: Labfire is a focused team chat application.
    APP_VERSION: <%= `git rev-parse --short HEAD`.strip %>
    GIT_REVISION: <%= `git rev-parse HEAD`.strip %>

volumes:
  - labfire_storage:/rails/storage

env:
  clear:
    SKIP_TELEMETRY: "1"
    RAILS_LOG_LEVEL: info
    RAILS_MAX_THREADS: "5"
    WEB_CONCURRENCY: "2"
  secret:
    - SECRET_KEY_BASE
    - VAPID_PUBLIC_KEY
    - VAPID_PRIVATE_KEY
    - VAPID_SUBJECT

aliases:
  shell: app exec --interactive --reuse "bash"
  rails: app exec --interactive --reuse "bin/rails"
  logs: app logs --follow
  backup: app exec --reuse "script/admin/prepare-backup"

retain_containers: 3
deploy_timeout: 120
drain_timeout: 30
